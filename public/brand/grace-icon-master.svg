<?xml version="1.0" encoding="UTF-8"?>
<!--
  Grace Precious Metals — balance scale icon (master)
  Geometry approved by CMO 2026-06-07. ViewBox 0 0 64 66.
  Color: single gold #9C7322 declared once on the root <g>; every fill and
  stroke inherits it, so a global swap to a Pantone metallic is one edit.
  Solid shapes (knob, post, beam, pedestal) carry a 1-unit gold stroke —
  intentional optical weight, matches the live web mark.
  Linework (suspension hangers + pans) is stroke-only.
  No external CSS, no <style>, no wrapper dependencies.

  Designer handoff notes:
    - Color swap point: the root <g fill="#9C7322" stroke="#9C7322">. Change
      those two values (or Select > Same > Fill/Stroke Color in Illustrator).
    - Expand strokes before scaling for print/signage (Object > Expand) so
      stroke weights don't shift with scale and colour separations behave.
    - This is a by-eye reconstruction of the on-screen mark, not a trace of
      original artwork. Treat as the geometry reference and rebuild as
      optically-refined filled compound paths for large-format output.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 66" width="100%" height="100%" role="img" aria-label="Grace Precious Metals">
  <title>Grace Precious Metals — balance scale</title>
  <g fill="#9C7322" stroke="#9C7322">
    <!-- Solid elements: top knob, vertical post, crossbar beam, two-tier pedestal foot -->
    <g>
      <circle cx="32" cy="4.5" r="4.5"/>
      <rect x="30.5" y="9" width="3" height="50"/>
      <rect x="5" y="18.5" width="54" height="3" rx="1"/>
      <rect x="26" y="59" width="12" height="2.5" rx="0.5"/>
      <rect x="19" y="61.5" width="26" height="3" rx="0.5"/>
    </g>
    <!-- Linework: triangular suspension hangers + open pan bowls (stroke only) -->
    <g fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 7 20 L 1.5 30 M 7 20 L 14.5 30" stroke-width="1.6"/>
      <path d="M 57 20 L 49.5 30 M 57 20 L 62.5 30" stroke-width="1.6"/>
      <path d="M 1.5 30 Q 8 39.5 14.5 30" stroke-width="2.4"/>
      <path d="M 49.5 30 Q 56 39.5 62.5 30" stroke-width="2.4"/>
    </g>
  </g>
</svg>
