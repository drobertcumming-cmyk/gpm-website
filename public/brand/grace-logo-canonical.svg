<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 96" role="img" aria-label="Grace Precious Metals">
  <title>Grace Precious Metals</title>

  <!--
    Canonical logo lockup for Grace Precious Metals.
    Background: transparent. Designed for cream canvas (#F5F0E1).
    Icon: gold-secondary balance/scales (#9C7322), filled vertical post.
    Wordmark "Grace": Source Serif 4, weight 500, walnut-deep (#3D2817).
    Tagline "PRECIOUS METALS": Inter, weight 500, gold-secondary (#9C7322), letter-spacing ~0.22em.
  -->

  <!-- Balance icon -->
  <g transform="translate(24, 16)">
    <g fill="#9C7322" stroke="#9C7322">
      <!-- Top knob (filled circle) -->
      <circle cx="32" cy="6" r="5"/>
      <!-- Vertical post -->
      <rect x="30" y="11" width="4" height="50"/>
      <!-- Base foot (horizontal bar) -->
      <rect x="18" y="61" width="28" height="3.5" rx="0.5"/>
      <!-- Crossbar -->
      <rect x="0" y="20" width="64" height="3" rx="0.5"/>
      <!-- Left chain -->
      <rect x="6" y="23" width="2" height="6"/>
      <!-- Right chain -->
      <rect x="56" y="23" width="2" height="6"/>
    </g>
    <!-- Left pan (open bowl, stroked) -->
    <path d="M 1 29 Q 7 39 13 29" fill="none" stroke="#9C7322" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Right pan (open bowl, stroked) -->
    <path d="M 51 29 Q 57 39 63 29" fill="none" stroke="#9C7322" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Wordmark: Grace -->
  <text x="120" y="50"
        font-family="'Source Serif 4', 'Source Serif Pro', Georgia, 'Times New Roman', serif"
        font-size="44"
        font-weight="500"
        fill="#3D2817"
        letter-spacing="0.5">Grace</text>

  <!-- Tagline: PRECIOUS METALS -->
  <text x="121" y="74"
        font-family="'Inter', -apple-system, system-ui, sans-serif"
        font-size="12"
        font-weight="500"
        fill="#9C7322"
        letter-spacing="2.5">PRECIOUS METALS</text>
</svg>
