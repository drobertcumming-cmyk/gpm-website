<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 96" role="img" aria-label="Grace Precious Metals">
  <title>Grace Precious Metals</title>

  <!--
    Canonical logo lockup for Grace Precious Metals.
    Background: transparent. Designed for cream canvas (#F5F0E1).
    Icon: gold-secondary balance/scales (#9C7322) — re-cut 2026-06-07 from the
    designer reference image (geometry approved by CMO): filled top knob, solid
    vertical post, crossbar beam, two triangular suspension hangers, two open
    Q-curve pans, two-tier pedestal foot. Kept in lockstep with the inline icon
    in components/nav/Logomark.tsx.
    Wordmark "Grace": Source Serif 4, weight 500, walnut-deep (#3D2817).
    Tagline "PRECIOUS METALS": Inter, weight 500, gold-secondary (#9C7322), letter-spacing ~0.22em.
    NOTE: typeface unchanged pending the design team's official vector source
    (CLAUDE.md open decision: "Production logo redrawing").
  -->

  <!-- Balance icon -->
  <g transform="translate(24, 16)">
    <g fill="#9C7322" stroke="#9C7322">
      <!-- Top knob (filled circle) -->
      <circle cx="32" cy="4.5" r="4.5"/>
      <!-- Vertical post -->
      <rect x="30.5" y="9" width="3" height="50"/>
      <!-- Crossbar beam -->
      <rect x="5" y="18.5" width="54" height="3" rx="1"/>
      <!-- Pedestal foot: upper step -->
      <rect x="26" y="59" width="12" height="2.5" rx="0.5"/>
      <!-- Pedestal foot: lower foot -->
      <rect x="19" y="61.5" width="26" height="3" rx="0.5"/>
    </g>
    <!-- Left suspension hangers (triangular) -->
    <path d="M 7 20 L 1.5 30 M 7 20 L 14.5 30" fill="none" stroke="#9C7322" stroke-width="1.6" stroke-linecap="round"/>
    <!-- Right suspension hangers (triangular) -->
    <path d="M 57 20 L 49.5 30 M 57 20 L 62.5 30" fill="none" stroke="#9C7322" stroke-width="1.6" stroke-linecap="round"/>
    <!-- Left pan (open bowl, stroked) -->
    <path d="M 1.5 30 Q 8 39.5 14.5 30" fill="none" stroke="#9C7322" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Right pan (open bowl, stroked) -->
    <path d="M 49.5 30 Q 56 39.5 62.5 30" fill="none" stroke="#9C7322" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Wordmark: Grace -->
  <text x="120" y="50"
        font-family="'Source Serif 4', 'Source Serif Pro', Georgia, 'Times New Roman', serif"
        font-size="44"
        font-weight="500"
        fill="#3D2817"
        letter-spacing="0.5">Grace</text>

  <!-- Tagline: PRECIOUS METALS -->
  <text x="121" y="74"
        font-family="'Inter', -apple-system, system-ui, sans-serif"
        font-size="12"
        font-weight="500"
        fill="#9C7322"
        letter-spacing="2.5">PRECIOUS METALS</text>
</svg>
